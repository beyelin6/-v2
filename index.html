<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>V-MAX Omni-Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
  
  :root {
    /* [重構] 改為實體邊框與陰影設定 */
    --ui-border: #e2e8f0; /* slate-200 */
    --ui-bg: #ffffff;
    --ui-shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    --ui-shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    --ui-shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
  }

body {
    font-family: 'Noto Sans TC', sans-serif;
    /* [重構] 極致清爽的冷白底色，徹底移除所有漸層干擾 */
    background-color: #f8fafc; 
    /* [重構] 將預設文字加深至 slate-800，提升閱讀銳利度 */
    color: #1e293b; 
    overflow: hidden; 
  }

  /* 自訂捲軸 (保持清爽) */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

  /* [重構] 實體主面板 (移除毛玻璃) */
  .glass-panel {
    background: var(--ui-bg);
    border: 1px solid var(--ui-border);
    box-shadow: var(--ui-shadow-md);
  }
  
  /* [重構] 實體卡片 (移除毛玻璃) */
  .glass-card {
    background: var(--ui-bg);
    border: 1px solid var(--ui-border);
    box-shadow: var(--ui-shadow-sm);
    transition: all 0.2s ease-in-out;
  }
  
  /* [重構] 卡片懸停效果：純粹的上浮與陰影加深，不再有混濁的邊框色 */
  .glass-card:hover {
    border-color: #cbd5e1; /* slate-300 */
    transform: translateY(-2px);
    box-shadow: var(--ui-shadow-hover);
  }

      /* Text Glow Utilities - Adjusted for Light Mode */
      .text-glow-blue {
        text-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
      }
      .text-glow-emerald {
        text-shadow: 0 0 15px rgba(52, 211, 153, 0.3);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",

    "@google/genai": "https://esm.sh/@google/genai@^1.41.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.564.0",
    "react-markdown": "https://esm.sh/react-markdown@^10.1.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

    <div id="root"></div>

</body>
</html>
